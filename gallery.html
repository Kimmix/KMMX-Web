<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KMMX - Art Gallery</title>
    <meta name="description" content="KMMX Art Gallery - Collection of commissioned and gift artwork" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-status-bar" content="#141414" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="view-transition" content="same-origin">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/gallery.css">
</head>

<body>
    <div class="gallery-container">
        <header class="gallery-header">
            <div class="header-content">
                <div class="header-title-area">
                    <h1>Art Gallery</h1>
                    <p class="gallery-subtitle">A collection of commissioned artwork and gifts from talented artists</p>
                </div>

                <input type="search" id="gallerySearch" class="gallery-search"
                    placeholder="Search by title or artist..." aria-label="Search gallery by title or artist">
            </div>
            <div class="gallery-controls">
                <div class="gallery-filters">
                    <button class="filter-btn active" data-filter="all"><span class="filter-icon">✦</span>All</button>
                    <button class="filter-btn" data-filter="commission"><span
                            class="filter-icon">🖌️</span>Commissions</button>
                    <button class="filter-btn" data-filter="gift"><span class="filter-icon">🎁</span>Gift Art</button>
                    <button class="filter-btn" data-filter="ych"><span class="filter-icon">🎨</span>YCH</button>
                </div>

                <div class="gallery-sort">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect">
                        <option value="oldest">Oldest First</option>
                        <option value="newest">Newest First</option>
                        <option value="artist">Artist Name</option>
                    </select>
                </div>
            </div>

            <div class="gallery-stats">
                <span id="itemCount">0</span> artworks displayed
            </div>
        </header>
        <main class="gallery-grid" id="galleryGrid">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Loading gallery...</p>
            </div>
        </main>
    </div>

    <dialog id="imagePopup" class="image-popup">
        <button type="button" class="nav-btn prev-btn" id="prevImage" aria-label="Previous artwork">&lt;</button>
        <div class="popup-content">
            <img id="popupImage" src="" alt="Full size artwork">
            <div class="popup-info">
                <h2 id="popupTitle"></h2>
                <h3>Artist: <span id="popupArtist"></span></h3>
            </div>
        </div>
        <button type="button" class="nav-btn next-btn" id="nextImage" aria-label="Next artwork">&gt;</button>
        <form method="dialog">
            <button class="close-btn" aria-label="Close image viewer">&times;</button>
        </form>
    </dialog>

    <script src="js/gallery.js"></script>
    <script src="js/favicon.js" defer></script>
</body>

</html>
