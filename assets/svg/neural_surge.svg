<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neural-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB2040" />
      <stop offset="60%" stop-color="#893B85" />
      <stop offset="100%" stop-color="#3C405D" />
    </linearGradient>
    <filter id="neural-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central node -->
  <circle cx="50" cy="50" r="8" fill="#CB2040" filter="url(#neural-glow)">
    <animate attributeName="r" values="8;9;8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Neural connections -->
  <path d="M50,50 L30,20" stroke="url(#neural-gradient)" stroke-width="2" fill="none">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M50,50 L80,30" stroke="url(#neural-gradient)" stroke-width="2" fill="none">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite" />
  </path>
  <path d="M50,50 L70,75" stroke="url(#neural-gradient)" stroke-width="2" fill="none">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.2s" repeatCount="indefinite" />
  </path>
  <path d="M50,50 L20,65" stroke="url(#neural-gradient)" stroke-width="2" fill="none">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.7s" repeatCount="indefinite" />
  </path>
  <path d="M50,50 L25,40" stroke="url(#neural-gradient)" stroke-width="2" fill="none">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.9s" repeatCount="indefinite" />
  </path>

  <!-- Outer nodes -->
  <circle cx="30" cy="20" r="5" fill="#CB2040" opacity="0.7" />
  <circle cx="80" cy="30" r="5" fill="#893B85" opacity="0.7" />
  <circle cx="70" cy="75" r="5" fill="#3C405D" opacity="0.7" />
  <circle cx="20" cy="65" r="5" fill="#893B85" opacity="0.7" />
  <circle cx="25" cy="40" r="5" fill="#CB2040" opacity="0.7" />

  <!-- Electric sparks -->
  <path d="M50,50 L55,30 L50,35 L60,25" stroke="#fff" stroke-width="1" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.5s" repeatCount="indefinite" />
  </path>
  <path d="M50,50 L40,60 L45,60 L35,70" stroke="#fff" stroke-width="1" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="0.7s" repeatCount="indefinite" />
  </path>
</svg>