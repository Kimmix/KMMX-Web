<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shard-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB2040" />
      <stop offset="60%" stop-color="#893B85" />
      <stop offset="100%" stop-color="#3C405D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Wave effect -->
    <filter id="wave-effect">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" result="noise">
        <animate attributeName="baseFrequency" values="0.01;0.02;0.01" dur="5s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>
  </defs>


  <!-- Main triangular shard with only 3 points -->
  <path d="M25,25 L85,60 L30,80 Z" fill="url(#shard-gradient)" filter="url(#glow)" stroke="#CB2040" stroke-width="1">
    <animate attributeName="opacity" values="1;0.9;1" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Enhanced resonant inner lines (also triangular) with animation -->
  <path d="M35,35 L75,60 L40,70 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" opacity="0.7">
    <animate attributeName="stroke-width" values="1;1.5;1" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M45,45 L65,55 L48,65 Z" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" opacity="0.6">
    <animate attributeName="stroke-width" values="0.8;1.2;0.8" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="1.5s" repeatCount="indefinite" />
  </path>
</svg>