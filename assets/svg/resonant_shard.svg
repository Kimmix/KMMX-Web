<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shard-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB2040" />
      <stop offset="60%" stop-color="#893B85" />
      <stop offset="100%" stop-color="#3C405D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <path d="M50,15 L65,40 L80,30 L70,50 L90,70 L65,65 L60,90 L45,70 L20,80 L35,55 L15,35 L40,40 L50,15"
        fill="url(#shard-gradient)"
        filter="url(#glow)"
        stroke="#CB2040"
        stroke-width="1" />
  <circle cx="50" cy="50" r="5" fill="#fff" opacity="0.8" />
  <circle cx="50" cy="50" r="3" fill="#CB2040" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>