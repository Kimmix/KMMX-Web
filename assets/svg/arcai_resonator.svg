<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#CB2040;stop-opacity:0.8"/>
            <stop offset="100%" style="stop-color:#FF446C;stop-opacity:0.6"/>
        </linearGradient>
        <filter id="blur">
            <feGaussianBlur stdDeviation="4"/>
        </filter>
    </defs>
    <!-- Core structure -->
    <g transform="translate(400,400)">
        <!-- Outer ring -->
        <circle cx="0" cy="0" r="300" fill="none" stroke="#CB2040" stroke-width="2"/>
        <!-- Inner mechanism -->
        <g>
            <path d="M-150,-150 L150,150 M-150,150 L150,-150" stroke="#CB2040" stroke-width="4"/>
            <circle cx="0" cy="0" r="180" fill="none" stroke="#FF446C" stroke-width="3"/>
            <circle cx="0" cy="0" r="120" fill="none" stroke="#CB2040" stroke-width="2"/>
        </g>
        <!-- Energy points -->
        <g>
            <circle cx="0" cy="-200" r="20" fill="#CB2040" opacity="0.6">
                <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="200" cy="0" r="20" fill="#CB2040" opacity="0.6">
                <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="200" r="20" fill="#CB2040" opacity="0.6">
                <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="-200" cy="0" r="20" fill="#CB2040" opacity="0.6">
                <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
            </circle>
        </g>
        <!-- Center core -->
        <circle cx="0" cy="0" r="40" fill="#FF446C">
            <animate attributeName="r" values="40;45;40" dur="1.5s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>