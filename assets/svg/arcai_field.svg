<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="field-gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#CB2040" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#893B85" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3C405D" stop-opacity="0.2" />
    </radialGradient>
    <filter id="field-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#field-gradient)" filter="url(#field-glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#CB2040" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#893B85" stroke-width="1" opacity="0.7">
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="10" fill="#CB2040" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="5" fill="#fff" opacity="0.6" />
</svg>