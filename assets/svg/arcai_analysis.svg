<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="analysis-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB2040" />
      <stop offset="60%" stop-color="#893B85" />
      <stop offset="100%" stop-color="#3C405D" />
    </linearGradient>
    <filter id="analysis-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central data core -->
  <circle cx="50" cy="50" r="12" fill="url(#analysis-gradient)" filter="url(#analysis-glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.8" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Data visualization rings -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#CB2040" stroke-width="1" stroke-dasharray="3,2" opacity="0.7">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="18s"
      repeatCount="indefinite" />
  </circle>

  <circle cx="50" cy="50" r="30" fill="none" stroke="#893B85" stroke-width="1" stroke-dasharray="5,3" opacity="0.6">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="360 50 50"
      to="0 50 50"
      dur="24s"
      repeatCount="indefinite" />
  </circle>

  <!-- Data points -->
  <circle cx="50" cy="20" r="2" fill="#CB2040" opacity="0.9">
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="50" r="2" fill="#893B85" opacity="0.9">
    <animate attributeName="r" values="2;3;2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="80" r="2" fill="#3C405D" opacity="0.9">
    <animate attributeName="r" values="2;3;2" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="50" r="2" fill="#CB2040" opacity="0.9">
    <animate attributeName="r" values="2;3;2" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Data connections -->
  <line x1="50" y1="50" x2="50" y2="20" stroke="#CB2040" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite" />
  </line>
  <line x1="50" y1="50" x2="80" y2="50" stroke="#893B85" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite" />
  </line>
  <line x1="50" y1="50" x2="50" y2="80" stroke="#3C405D" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite" />
  </line>
  <line x1="50" y1="50" x2="20" y2="50" stroke="#CB2040" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite" />
  </line>

  <!-- Analysis overlay -->
  <g class="analysis-grid">
    <path d="M20,30 L80,30" stroke="#893B85" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,2" />
    <path d="M20,50 L80,50" stroke="#893B85" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,2" />
    <path d="M20,70 L80,70" stroke="#893B85" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,2" />
    <path d="M30,20 L30,80" stroke="#893B85" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,2" />
    <path d="M50,20 L50,80" stroke="#893B85" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,2" />
    <path d="M70,20 L70,80" stroke="#893B85" stroke-width="0.5" opacity="0.4" stroke-dasharray="1,2" />
  </g>

  <!-- Scanning effect -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1" />
  <line x1="20" y1="20" x2="80" y2="80" stroke="#CB2040" stroke-width="1" opacity="0.6">
    <animate attributeName="y1" values="20;80;20" dur="5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="80;20;80" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- Data particles -->
  <circle cx="40" cy="40" r="1" fill="#ffffff" opacity="0.8">
    <animate attributeName="cx" values="40;60;40" dur="5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="40;60;40" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="60" cy="40" r="1" fill="#ffffff" opacity="0.8">
    <animate attributeName="cx" values="60;40;60" dur="6s" repeatCount="indefinite" />
    <animate attributeName="cy" values="40;60;40" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>