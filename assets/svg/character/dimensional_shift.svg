<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="dim-gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#CB2040" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#893B85" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#3C405D" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
    <filter id="dim-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Vortex effect -->
    <linearGradient id="vortex-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB2040" />
      <stop offset="50%" stop-color="#893B85" />
      <stop offset="100%" stop-color="#3C405D" />
    </linearGradient>

    <!-- Star effect -->
    <radialGradient id="star-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#CB2040" stop-opacity="0" />
    </radialGradient>

    <!-- Animation paths -->
    <path id="orbit1" d="M50,50 m0,-30 a30,15 0 1,1 0,60 a30,15 0 1,1 0,-60" />
    <path id="orbit2" d="M50,50 m0,-25 a25,25 0 1,0 0,50 a25,25 0 1,0 0,-50" />
  </defs>

  <!-- Dark energy vortex -->
  <g class="vortex">
    <ellipse cx="50" cy="50" rx="40" ry="15" fill="url(#dim-gradient)" opacity="0.9" transform="rotate(0, 50, 50)">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="15s"
        repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="50" cy="50" rx="35" ry="10" fill="url(#dim-gradient)" opacity="0.8" transform="rotate(45, 50, 50)">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="45 50 50"
        to="405 50 50"
        dur="12s"
        repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="50" cy="50" rx="28" ry="28" fill="url(#dim-gradient)" opacity="0.7" filter="url(#dim-glow)">
      <animate
        attributeName="rx"
        values="28;32;28"
        dur="4s"
        repeatCount="indefinite" />
      <animate
        attributeName="ry"
        values="28;24;28"
        dur="4s"
        repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Dimensional rifts -->
  <g class="rifts">
    <path d="M30,40 L45,45 L35,55 L50,50 Z" fill="#CB2040" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" />
    </path>

    <path d="M70,30 L60,50 L75,55 L65,40 Z" fill="#893B85" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite" />
    </path>

    <path d="M40,75 L55,65 L60,80 L50,70 Z" fill="#3C405D" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dimensional particles -->
  <g class="particles">
    <circle cx="50" cy="50" r="1.5" fill="#ffffff">
      <animateMotion
        path="M0,0 L10,-20 L-15,-15 L-20,10 L5,15 Z"
        dur="3s"
        repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
    </circle>

    <circle cx="50" cy="50" r="1" fill="#ffffff">
      <animateMotion
        path="M0,0 L-20,-10 L-10,15 L15,20 L20,-5 Z"
        dur="4s"
        repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite" />
    </circle>

    <circle cx="50" cy="50" r="0.7" fill="#ffffff">
      <animateMotion
        path="M0,0 L15,10 L20,-15 L-10,-20 L-15,5 Z"
        dur="5s"
        repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Central energy core -->
  <circle cx="50" cy="50" r="8" fill="url(#star-gradient)" filter="url(#dim-glow)">
    <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Orbiting energy -->
  <circle r="3" fill="#CB2040" opacity="0.9">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#orbit1" />
    </animateMotion>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite" />
  </circle>

  <circle r="2" fill="#ffffff" opacity="0.7">
    <animateMotion dur="5s" repeatCount="indefinite" begin="1s">
      <mpath href="#orbit2" />
    </animateMotion>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>