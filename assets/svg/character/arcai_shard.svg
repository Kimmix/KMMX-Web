<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
    <defs>
        <!-- Radial gradient for core energy with animation -->
        <radialGradient id="coreEnergy" cx="30%" cy="40%" r="60%">
            <stop offset="0%" style="stop-color:#CB2040;stop-opacity:0.8">
                <animate attributeName="stop-opacity"
                         values="0.8;0.4;0.8"
                         dur="2s"
                         repeatCount="indefinite"/>
            </stop>
            <stop offset="40%" style="stop-color:#CB2040;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#CB2040;stop-opacity:0"/>
        </radialGradient>

        <!-- Glow effect for shard -->
        <filter id="shardGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
            <feColorMatrix in="blur" type="matrix" values="
                1 0 0 0 0
                0 0.5 0 0 0
                0 0 0.5 0 0
                0 0 0 0.8 0" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Highlight glow for key points - using primary color -->
        <filter id="highlightGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
            <feColorMatrix type="matrix" values="
                1 0 0 0 0.8
                0 0.2 0 0 0
                0 0 0.2 0 0
                0 0 0 1 0"/>
        </filter>

        <!-- Pulse effect for energy nodes -->
        <filter id="energyPulse" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
        </filter>

    </defs>

    <!-- Random background small crystal fragments -->
    <g id="backgroundFragments" opacity="0.5">
        <path d="M40,70 L50,90 L30,95 Z" fill="#CB2040"/>
        <path d="M260,60 L270,75 L250,80 Z" fill="#CB2040"/>
        <path d="M250,230 L270,240 L260,260 L240,245 Z" fill="#CB2040"/>
        <path d="M50,210 L65,230 L40,240 Z" fill="#CB2040" />
        <path d="M150,30 L160,40 L155,50 L145,45 Z" fill="#CB2040" />
        <path d="M150,270 L160,260 L170,270 L155,280 Z" fill="#CB2040" />

        <!-- Dust particles -->
        <circle cx="80" cy="120" r="1" fill="#FFFFFF"/>
        <circle cx="220" cy="100" r="0.8" fill="#FFFFFF"/>
        <circle cx="190" cy="230" r="0.9" fill="#FFFFFF"/>
        <circle cx="120" cy="190" r="0.9" fill="#FFFFFF"/>
        <circle cx="100" cy="70" r="0.7" fill="#FFFFFF"/>
        <circle cx="230" cy="190" r="1" fill="#FFFFFF"/>
        <circle cx="70" cy="260" r="0.8" fill="#FFFFFF"/>
        <circle cx="240" cy="140" r="0.7" fill="#FFFFFF"/>
        <circle cx="60" cy="150" r="0.9" fill="#FFFFFF"/>
        <circle cx="210" cy="40" r="0.8" fill="#FFFFFF"/>
        <circle cx="130" cy="260" r="0.7" fill="#FFFFFF"/>
        <circle cx="190" cy="60" r="0.6" fill="#FFFFFF"/>
    </g>

    <!-- Main shard - asymmetric crystalline formation with imperfections -->
    <g id="mainShard" style="filter:url(#shardGlow)">
        <!-- Primary shard shape with imperfections -->
        <path d="M150,50 L183,118 L210,150 L195,208 L150,240 L108,212 L95,155 L120,122 Z"
              fill="url(#coreEnergy)"
              stroke="#CB2040"
              stroke-width="1.5"
              stroke-opacity="0.9"
              opacity="1">
            <animate attributeName="opacity"
                     values="1;0.8;1"
                     dur="3s"
                     repeatCount="indefinite"/>
        </path>

    </g>

    <!-- Subtle ambient floating particles with primary color only for selected particles -->
    <g id="ambientParticles">
        <circle cx="170" cy="80" r="1.5" fill="#FF3060" opacity="0.8">
            <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="130" cy="80" r="1.5" fill="#FFFFFF" opacity="0.7">
            <animate attributeName="cy" values="80;90;80" dur="4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.7;0.4;0.7" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="190" cy="170" r="1.5" fill="#FFFFFF" opacity="0.7">
            <animate attributeName="cy" values="170;160;170" dur="3.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="110" cy="170" r="1.5" fill="#FFFFFF" opacity="0.6">
            <animate attributeName="cy" values="170;180;170" dur="4.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="150" cy="200" r="1.5" fill="#FF3060" opacity="0.8">
            <animate attributeName="cy" values="200;190;200" dur="5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.8;0.5;0.8" dur="5s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>