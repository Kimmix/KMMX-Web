<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rune-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB2040" />
      <stop offset="60%" stop-color="#893B85" />
      <stop offset="100%" stop-color="#3C405D" />
    </linearGradient>
    <filter id="rune-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rune Circle -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#rune-gradient)" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Inner Rune Patterns -->
  <g filter="url(#rune-glow)">
    <!-- Dimensional Triangles -->
    <path d="M50,20 L70,60 L30,60 Z" fill="none" stroke="#CB2040" stroke-width="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="4s" repeatCount="indefinite" />
    </path>

    <path d="M50,30 L65,55 L35,55 Z" fill="none" stroke="#893B85" stroke-width="1" opacity="0.6">
      <animate attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite" />
    </path>

    <!-- Spatial awareness symbolism -->
    <path d="M30,35 L70,35 M30,65 L70,65 M35,30 L35,70 M65,30 L65,70"
          stroke="#893B85" stroke-width="0.5" opacity="0.6" stroke-dasharray="1 2">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Rune Symbols -->
    <path d="M40,30 L45,25 L50,30 L55,25 L60,30" stroke="#CB2040" stroke-width="2" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="7s" repeatCount="indefinite" />
    </path>

    <path d="M35,45 L40,40 L45,45 L50,40 L55,45 L60,40 L65,45" stroke="#CB2040" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="8s" repeatCount="indefinite" />
    </path>

    <path d="M40,65 L50,55 L60,65" stroke="#CB2040" stroke-width="2" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Connecting lines representing spatial sensing -->
    <line x1="50" y1="20" x2="50" y2="80" stroke="#3C405D" stroke-width="0.5" opacity="0.5" stroke-dasharray="2 3">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="10s" repeatCount="indefinite" />
    </line>

    <line x1="20" y1="50" x2="80" y2="50" stroke="#3C405D" stroke-width="0.5" opacity="0.5" stroke-dasharray="2 3">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="12s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Subtle 4D perspective hint (hypercube projection) -->
  <g opacity="0.6">
    <path d="M40,40 L60,40 L60,60 L40,60 Z" fill="none" stroke="#CB2040" stroke-width="0.75">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite" />
    </path>

    <path d="M35,35 L55,35 L55,55 L35,55 Z" fill="none" stroke="#893B85" stroke-width="0.75" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite" />
    </path>

    <line x1="40" y1="40" x2="35" y2="35" stroke="#3C405D" stroke-width="0.5" />
    <line x1="60" y1="40" x2="55" y2="35" stroke="#3C405D" stroke-width="0.5" />
    <line x1="60" y1="60" x2="55" y2="55" stroke="#3C405D" stroke-width="0.5" />
    <line x1="40" y1="60" x2="35" y2="55" stroke="#3C405D" stroke-width="0.5" />
  </g>

  <!-- Central Energy Point -->
  <circle cx="50" cy="50" r="5" fill="url(#rune-gradient)" opacity="0.9" filter="url(#rune-glow)">
    <animate attributeName="r" values="5;6;5" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0.7;0.9" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>