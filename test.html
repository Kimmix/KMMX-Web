<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repeating Horizontal SVG Background</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f0f0f0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="blue" stroke-width="5" fill="none"/></svg>');
      background-repeat: repeat-x;
      background-size: auto 100px; /* Adjust the height as desired */
    }
  </style>
</head>
<body>
</body>
</html>
