<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Character Stat Screen</title>
  <style>
    body {
      background-color: #101014; /* Background color */
      color: #ffffff; /* Text color for better visibility */
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h2 {
      margin-top: 20px;
    }
    #radarChart {
      background-color: transparent; /* Make canvas background transparent */
      margin-top: 20px;
    }
    .chart-container {
      position: relative;
      width: 500px;
      height: 500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

<h2>Character Stats</h2>
<div class="chart-container">
  <canvas id="radarChart" width="500" height="500"></canvas>
</div>

<script>
  var canvas = document.getElementById('radarChart');
  var ctx = canvas.getContext('2d');

  var data = {
    'Focus': 25,
    'Bandwidth': 5,
    'Reach': 15,
    'Capacity': 25,
    'Control': 30
  };

  var centerX = canvas.width / 2;
  var centerY = canvas.height / 2;
  var radius = 150;
  var maxValue = 40;
  var levels = 4;
  var keys = Object.keys(data);
  var dataValues = keys.map(function(key) { return data[key]; });
  var numAxes = keys.length;
  var angleStep = (2 * Math.PI) / numAxes;

  // Function to draw the grid and axes
  function drawGrid() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    for (var level = 1; level <= levels; level++) {
      ctx.beginPath();
      var levelRadius = (radius / levels) * level;
      for (var i = 0; i <= numAxes; i++) {
        var angle = i * angleStep;
        var x = centerX + levelRadius * Math.sin(angle);
        var y = centerY - levelRadius * Math.cos(angle);
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.closePath();
      ctx.stroke();
    }

    // Draw axes
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    for (var i = 0; i < numAxes; i++) {
      var angle = i * angleStep;
      var x = centerX + radius * Math.sin(angle);
      var y = centerY - radius * Math.cos(angle);

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }

  // Function to plot the data
  function plotData() {
    ctx.beginPath();
    var gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
    gradient.addColorStop(0, 'rgba(0, 128, 255, 0.7)');
    gradient.addColorStop(1, 'rgba(0, 255, 255, 0.3)');

    for (var i = 0; i < numAxes; i++) {
      var value = dataValues[i];
      var angle = i * angleStep;
      var valueRadius = (value / maxValue) * radius;
      var x = centerX + valueRadius * Math.sin(angle);
      var y = centerY - valueRadius * Math.cos(angle);

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Function to add labels
  function addLabels() {
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    for (var i = 0; i < numAxes; i++) {
      var angle = i * angleStep;
      var x = centerX + (radius + 40) * Math.sin(angle);
      var y = centerY - (radius + 40) * Math.cos(angle);
      ctx.fillText(keys[i], x, y);
    }
  }

  // Function to add level labels (optional)
  function addLevelLabels() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    for (var level = 1; level <= levels; level++) {
      var levelRadius = (radius / levels) * level;
      ctx.fillText((level * (maxValue / levels)).toString(), centerX, centerY - levelRadius);
    }
  }

  // Draw the chart
  drawGrid();
  plotData();
  addLabels();
  addLevelLabels();
</script>

</body>
</html>
